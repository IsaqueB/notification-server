version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - notification-network

  api:
    image: golang:1.25-alpine
    container_name: notification-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: go run main.go
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network

  worker:
    image: golang:1.25-alpine
    container_name: notification-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: go run main.go -r=worker
    env_file:
      - .env
    ports:
      - "3001:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network

volumes:
  redis-data:

networks:
  notification-network:
    driver: bridge